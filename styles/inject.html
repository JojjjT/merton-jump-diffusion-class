<!-- Inyectado en el header de cada página -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<script>
  // Marca que el JS de revelado está activo ANTES de que el CSS
  // oculte algo: sin este flag, .merton-reveal nunca se oculta.
  document.documentElement.classList.add("js-anim");
</script>
<script>
  // Revelado de tarjetas con IntersectionObserver (sin dependencias).
  document.addEventListener("DOMContentLoaded", function () {
    var els = document.querySelectorAll(".merton-reveal");
    if (!els.length) return;

    if (!("IntersectionObserver" in window)) {
      els.forEach(function (el) { el.classList.add("is-visible"); });
      return;
    }

    // Stagger: 60ms entre hermanos de la misma fila
    var groups = new Map();
    els.forEach(function (el) {
      var parent = el.parentElement;
      var i = groups.get(parent) || 0;
      el.style.setProperty("--merton-delay", (i * 60) + "ms");
      groups.set(parent, i + 1);
    });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("is-visible");
          io.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    els.forEach(function (el) { io.observe(el); });
  });
</script>
